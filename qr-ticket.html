<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>Универсальный талон — Тикет</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 0%,#dcecff,transparent 40%),linear-gradient(135deg,#f8fbff,#edf2f8)}
.card{width:min(460px,100%);padding:28px 24px;border-radius:26px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 60px rgba(30,50,80,.14);text-align:center;backdrop-filter:blur(18px)}
.icon{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-size:40px}
h1{font-size:1.7rem;letter-spacing:-.04em;margin:0 0 10px}p{color:#657087;line-height:1.5;margin:8px 0}.price{font-size:2rem;font-weight:850;color:#15803d;margin:18px 0 6px}.muted{font-size:.82rem;margin-top:18px}.state{padding:12px 14px;border-radius:14px;background:#f1f5f9;color:#334155;margin-top:16px;font-size:.92rem}
button{width:100%;border:0;border-radius:15px;background:#1677f2;color:#fff;font-size:1rem;font-weight:750;padding:16px;margin-top:18px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
</style>
</head>
<body>
<main class="card">
  <div id="statusIcon" class="icon">🎟️</div>
  <h1 id="title">Универсальный талон</h1>
  <p id="description">Для оформления нового талона нажми кнопку ниже.</p>
  <div class="price">1,79 BYN</div>
  <p>Универсальный талон</p>
  <button id="issueButton" type="button">Оплатить и получить талон</button>
  <div id="details" class="state">Постоянный QR-код. Каждый новый талон оформляется только после нажатия кнопки.</div>
  <p class="muted">Это подтверждение оплаты внутри системы учёта. Деньги с банковской карты не списываются.</p>
</main>
<script>
(function(){
'use strict';
var SUPABASE_URL='https://ubhfigqpsepnpokrbdyo.supabase.co';
var SUPABASE_KEY='sb_publishable_yN8W8pvQq8hWsYMO8z1Rzw_6zKQ-8D1';
var ROW_URL=SUPABASE_URL+'/rest/v1/ticket_shared_state';
var PRICE=1.79;
var $=function(id){return document.getElementById(id)};
function show(icon,title,description,details,ok){
$('statusIcon').textContent=icon;$('statusIcon').style.background=ok?'#dcfce7':'#fee2e2';$('statusIcon').style.color=ok?'#15803d':'#b91c1c';
$('title').textContent=title;$('description').textContent=description;$('details').textContent=details;
}
async function issue(){
var button=$('issueButton');button.disabled=true;
try{
var headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
var response=await fetch(ROW_URL+'?select=data&id=eq.main',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},cache:'no-store'});
if(!response.ok)throw new Error('Не удалось подключиться к общей базе ('+response.status+').');
var rows=await response.json(),row=rows&&rows[0];if(!row||!row.data)throw new Error('Общая база данных пока не настроена.');
var data=row.data;if(!(data.shiftActive===true||data.shiftActive==='true')){show('!','Кассовая смена закрыта','Талон не оформлен.','Попроси кассира открыть смену и попробуй снова.',false);button.disabled=false;return;}
var tickets=Array.isArray(data.tickets)?data.tickets:[];
var num=Math.max(Number(data.lastTicketNum)||1001,1001);tickets.forEach(function(t){num=Math.max(num,(Number(t.num)||0)+1)});
var now=new Date(),iso=now.toISOString(),requestId='qr_'+(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,12));
var ticket={num:num,id:'ticket_'+requestId,time:now.toLocaleTimeString('ru-RU'),route:'Универсальный талон',routeId:null,from:'Универсальный',to:'Универсальный',price:PRICE,status:'active',conductor:data.conductorName||'Кондуктор',passenger:'full',note:'Универсальный талон по постоянному QR-коду',paymentMethod:'QR-ссылка',paymentStatus:'Оплачено в учёте',purchaseId:requestId,purchasedAt:iso,issuedAt:iso,shiftId:data.currentShiftId||null,tripId:null,qrRequestId:requestId};
data.tickets=tickets.concat([ticket]);data.lastTicketNum=num+1;
data.operations=Array.isArray(data.operations)?data.operations:[];
data.operations.push({id:'op_'+requestId,time:now.toLocaleString('ru-RU'),type:'Продажа QR-ссылка',ticket:num,amount:PRICE,conductor:data.conductorName||'Кондуктор',details:'Универсальный талон по постоянному QR-коду',createdAt:iso});
var save=await fetch(ROW_URL,{method:'POST',headers:Object.assign({},headers,{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:'main',data:data,updated_at:iso})});
if(!save.ok)throw new Error('Не удалось сохранить талон в общей базе ('+save.status+').');
show('✓','Билет оплачен','Универсальный талон успешно оформлен.','Билет №'+num+' · 1,79 BYN. Он записан в общую историю операций.',true);
button.textContent='Оформить ещё один талон';button.disabled=false;
}catch(e){show('!','Не удалось оформить билет','Талон пока не подтверждён.',e&&e.message?e.message:'Проверь интернет и попробуй снова.',false);button.disabled=false;}
}
$('issueButton').addEventListener('click',issue);
})();
</script>
</body>
</html>
