name: Patch conductor terminal
on:
  push:
    paths:
      - README.md
      - .github/workflows/patch-auto-sync.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the composition selector from the trip form completely.
          old = '<div class="form-group"><label>Состав</label><select id="compositionSelect" onchange="setCurrentComposition()"><option value="">— Состав не выбран —</option></select></div>'
          s = s.replace(old, '')

          # Do not add default compositions anymore; the feature is no longer exposed.
          old = "if(!state.compositions.length){state.compositions=['Состав №1','Состав №2'];persist();renderCompositions()}"
          s = s.replace(old, '')

          # Automatic Supabase sync for every conductor data change made through localStorage.
          marker = "const oldSet=window.localStorage.setItem.bind(window.localStorage);"
          inject = """const oldSet=window.localStorage.setItem.bind(window.localStorage);\n  let autoSyncTimer=null;\n  function scheduleAutoCloudSync(){if(!window.ticketCloudSave)return;clearTimeout(autoSyncTimer);autoSyncTimer=setTimeout(()=>window.ticketCloudSave(),250)}\n  window.localStorage.setItem=function(k,v){oldSet(k,v);if(typeof k==='string'&&k.indexOf('conductor_')===0)scheduleAutoCloudSync()};"""
          if "function scheduleAutoCloudSync()" not in s:
              if marker not in s:
                  raise SystemExit('sync marker not found')
              s = s.replace(marker, inject, 1)

          # Make startup synchronization finish by saving the current merged state.
          old = "if(typeof searchTickets==='function')searchTickets()}})}"
          new = "if(typeof searchTickets==='function')searchTickets();setTimeout(()=>window.ticketCloudSave&&window.ticketCloudSave(),150)}else{setTimeout(()=>window.ticketCloudSave&&window.ticketCloudSave(),150)}})}"
          if old not in s:
              raise SystemExit('startup sync marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('patched', len(s))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/patch-auto-sync.yml
          git commit -m 'feat: automatic cloud sync and hide composition selection'
          git push