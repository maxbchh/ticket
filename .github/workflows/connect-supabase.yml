name: Finalize refund feature
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize refund feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix refund print HTML and remove temporary files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</style></style>','</style>')
          s=s.replace("<script>window.__refundPrintPatch=true;</script>","")
          s=s.replace("join('\\\\n')", "join('\\n')")
          p.write_text(s,encoding='utf-8')
          Path('README.md').write_text('',encoding='utf-8')
          Path('.github/workflows/connect-supabase.yml').unlink()
          PY
      - name: Commit final version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize refund feature" || exit 0
          git push
