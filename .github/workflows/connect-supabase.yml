name: Restore enhanced index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'Restore enhanced index safely'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find and restore enhanced index
        run: |
          C=$(git log --all --format='%H%x09%s' | awk -F '\t' '$2=="Build full conductor terminal"{print $1; exit}')
          echo "Found $C"
          test -n "$C"
          git checkout "$C" -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore enhanced index safely"
          git push
