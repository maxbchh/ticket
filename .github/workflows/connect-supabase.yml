name: Add full conductor terminal features
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    if: github.event.head_commit.message != 'Build full conductor terminal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index.html without removing old functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* FULL CONDUCTOR MODULE */\n.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.feature-stat{padding:14px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-input)}.feature-stat b{display:block;font-size:1.25rem;margin-top:4px}.status-active{color:var(--accent-green);font-weight:700}.status-cancelled{color:var(--accent-red);font-weight:700}.ops-actions{display:flex;gap:7px;flex-wrap:wrap}.mini-btn{padding:7px 9px;font-size:.78rem}.sync-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:6px}.sync-ok{background:#20a464}.sync-wait{background:#f59e0b}\n'''
          s=s.replace('</style>',css+'</style>',1)
          tab='<button class="tab-btn" onclick="switchTab(\'operations\',this)">🎫 Билеты и Операции</button>'
          s=s.replace('<button class="tab-btn" onclick="switchTab(\'settings\',this)">⚙️ Настройки Терминала</button>',tab+'<button class="tab-btn" onclick="switchTab(\'settings\',this)">⚙️ Настройки Терминала</button>',1)
          ui='''\n<div id="tab-operations" class="tab-content">\n<div class="card"><div class="card-title"><span>🔎 Поиск и управление билетами</span><span id="cloudStatus"><span class="sync-dot sync-wait"></span>Синхронизация</span></div>\n<div class="form-grid"><div class="form-group"><label>Номер билета</label><input id="ticketSearchNum" type="number" placeholder="Например: 1001" oninput="searchTickets()"></div><div class="form-group"><label>От / До / маршрут</label><input id="ticketSearchText" type="text" placeholder="Поиск по маршруту или станции" oninput="searchTickets()"></div></div>\n<div id="ticketSearchResults"></div></div>\n<div class="card"><div class="card-title">📋 История операций</div><div class="table-responsive"><table><thead><tr><th>Время</th><th>Операция</th><th>Билет</th><th>Сумма</th><th>Кондуктор</th></tr></thead><tbody id="operationsBody"></tbody></table></div></div>\n<div class="card"><div class="card-title">📊 Сводка текущей смены</div><div class="feature-grid"><div class="feature-stat">Активных билетов<b id="opActiveTickets">0</b></div><div class="feature-stat">Отменено<b id="opCancelledTickets">0</b></div><div class="feature-stat">Выручка<b id="opRevenue">0.00 руб.</b></div><div class="feature-stat">Возвраты<b id="opRefunds">0.00 руб.</b></div></div></div>\n</div>\n'''
          s=s.replace('<div id="tab-settings" class="tab-content">',ui+'<div id="tab-settings" class="tab-content">',1)
          extra_settings='''<div class="card"><div class="card-title">☁️ Общая база данных</div><p style="font-size:.85rem;color:var(--text-secondary);margin-bottom:12px">Данные сохраняются в Supabase и доступны после открытия терминала на другом устройстве.</p><div class="ops-actions"><button class="btn btn-cyan" onclick="syncConductorData()">☁️ Синхронизировать сейчас</button><button class="btn btn-outline" onclick="downloadConductorBackup()">💾 Резервная копия</button></div></div>'''
          s=s.replace('<div class="card"><div class="card-title">Настройки Билета и Печати</div>',extra_settings+'<div class="card"><div class="card-title">Настройки Билета и Печати</div>',1)
          composition='<div class="form-group"><label>Состав</label><select id="compositionSelect" onchange="setCurrentComposition()"><option value="">— Состав не выбран —</option></select></div>'
          s=s.replace('<div class="form-group"><label>Вагон / Место</label>',composition+'<div class="form-group"><label>Вагон / Место</label>',1)
          marker='<!-- TICKET_SUPABASE_SHARED -->'
          s=s.replace(marker+'<script src="./supabase-shared.js"></script>','',1)
          js=r'''\n<script>\n(function(){\n  state.operations=Array.isArray(state.operations)?state.operations:JSON.parse(localStorage.getItem('conductor_operations')||'[]');\n  state.refunds=Array.isArray(state.refunds)?state.refunds:[];\n  state.compositions=Array.isArray(state.compositions)?state.compositions:JSON.parse(localStorage.getItem('conductor_compositions')||'[]');\n  state.currentComposition=state.currentComposition||localStorage.getItem('conductor_current_composition')||'';\n  state.shiftStartedAt=state.shiftStartedAt||localStorage.getItem('conductor_shift_started_at')||'';\n  const oldSet=window.localStorage.setItem.bind(window.localStorage);\n  function persist(){oldSet('conductor_tickets',JSON.stringify(state.tickets));oldSet('conductor_routes',JSON.stringify(state.routes));oldSet('conductor_operations',JSON.stringify(state.operations));oldSet('conductor_compositions',JSON.stringify(state.compositions));oldSet('conductor_current_composition',state.currentComposition||'');oldSet('conductor_shift_started_at',state.shiftStartedAt||'');oldSet('conductor_last_num',String(state.lastTicketNum));if(window.ticketCloudSave)window.ticketCloudSave();}\n  window.syncConductorData=function(){persist();const e=document.getElementById('cloudStatus');if(e)e.innerHTML='<span class="sync-dot sync-ok"></span>Сохранено';setTimeout(()=>{if(e)e.innerHTML='<span class="sync-dot sync-wait"></span>Синхронизация'},1800)};\n  window.addOperation=function(type,ticket,amount,details){state.operations.push({time:new Date().toLocaleString('ru-RU'),type,ticket:ticket||'',amount:Number(amount||0),conductor:state.conductorName||'Кондуктор',details:details||''});persist();renderOperations()};\n  window.renderOperations=function(){const b=document.getElementById('operationsBody');if(b)b.innerHTML=state.operations.slice().reverse().map(o=>'<tr><td>'+o.time+'</td><td>'+o.type+'</td><td>'+o.ticket+'</td><td>'+Number(o.amount||0).toFixed(2)+' руб.</td><td>'+o.conductor+'</td></tr>').join('');const active=state.tickets.filter(t=>t.status!=='cancelled');const cancelled=state.tickets.filter(t=>t.status==='cancelled');const rev=active.reduce((a,t)=>a+Number(t.price||0),0);const ref=cancelled.reduce((a,t)=>a+Number(t.refund||t.price||0),0);['opActiveTickets','opCancelledTickets','opRevenue','opRefunds'].forEach((id,i)=>{const e=document.getElementById(id);if(e)e.textContent=[active.length,cancelled.length,rev.toFixed(2)+' руб.',ref.toFixed(2)+' руб.'][i]})};\n  window.searchTickets=function(){const n=(document.getElementById('ticketSearchNum')?.value||'').trim(),q=(document.getElementById('ticketSearchText')?.value||'').toLowerCase().trim(),box=document.getElementById('ticketSearchResults');if(!box)return;let a=state.tickets.filter(t=>(!n||String(t.num)===n)&&(!q||JSON.stringify(t).toLowerCase().includes(q))).slice().reverse();box.innerHTML=a.length?a.map(t=>'<div class="feature-stat" style="margin-top:8px"><strong>Билет №'+t.num+'</strong> — '+t.from+' → '+t.to+' — '+Number(t.price||0).toFixed(2)+' руб. — <span class="'+(t.status==='cancelled'?'status-cancelled':'status-active')+'">'+(t.status==='cancelled'?'АННУЛИРОВАН':'ДЕЙСТВИТЕЛЕН')+'</span><div class="ops-actions" style="margin-top:8px"><button class="btn btn-outline mini-btn" onclick="reprintTicket('+t.num+')">♻️ Повторить печать</button>'+(t.status!=='cancelled'?'<button class="btn btn-red mini-btn" onclick="cancelTicket('+t.num+')">❌ Аннулировать</button>':'')+'</div></div>').join(''):'<p style="color:var(--text-secondary)">Билеты не найдены.</p>'};\n  window.reprintTicket=function(num){const t=state.tickets.find(x=>Number(x.num)===Number(num));if(!t)return;document.getElementById('ticketPreview').innerText=['------------------------------',centerText('ПОВТОРНАЯ ПЕЧАТЬ'),centerText('БИЛЕТ № '+t.num),'------------------------------',t.from+' -> '+t.to,'Рейс: '+(t.route||''),'Сумма: '+Number(t.price||0).toFixed(2)+' руб.',t.status==='cancelled'?'АННУЛИРОВАН':'' ,'------------------------------',new Date().toLocaleString('ru-RU')].filter(Boolean).join('\\n');printTicket()};\n  window.cancelTicket=function(num){const t=state.tickets.find(x=>Number(x.num)===Number(num));if(!t||t.status==='cancelled')return;const reason=prompt('Причина аннулирования:','Ошибка оформления');if(reason===null)return;t.status='cancelled';t.cancelReason=reason;t.refund=Number(t.price||0);state.refunds.push({num:t.num,amount:t.refund,reason,time:new Date().toLocaleString('ru-RU')});addOperation('Аннулирование',t.num,-t.refund,reason);updateShiftStats();searchTickets();};\n  window.setCurrentComposition=function(){state.currentComposition=document.getElementById('compositionSelect')?.value||'';persist()};\n  window.renderCompositions=function(){const s=document.getElementById('compositionSelect');if(!s)return;const cur=state.currentComposition;s.innerHTML='<option value="">— Состав не выбран —</option>'+state.compositions.map(x=>'<option value="'+x.replace(/\\"/g,'&quot;')+'">'+x+'</option>').join('');s.value=cur};\n  window.addComposition=function(){const v=prompt('Введите номер или название состава:');if(!v)return;if(!state.compositions.includes(v.trim()))state.compositions.push(v.trim());state.currentComposition=v.trim();persist();renderCompositions()};\n  window.downloadConductorBackup=function(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state,null,2));a.download='conductor_backup_'+Date.now()+'.json';a.click()};\n  const originalProcess=window.processTicketSale;\n  window.processTicketSale=function(){if(!state.shiftActive){alert("Ошибка: Смена закрыта! Откройте смену.");return}const before=state.lastTicketNum;originalProcess();const t=state.tickets.find(x=>Number(x.num)===before);if(t){t.status='active';t.conductor=state.conductorName;t.train=document.getElementById('trainNumInput')?.value||'';t.composition=state.currentComposition||'';t.passenger=document.getElementById('passengerType')?.value||'full';t.note=document.getElementById('ticketNoteInput')?.value||'';t.issuedAt=new Date().toISOString();addOperation('Продажа',t.num,t.price,'Билет выпущен');persist();renderOperations();searchTickets()}};\n  const originalOpen=window.openShift;window.openShift=function(){originalOpen();state.shiftStartedAt=new Date().toISOString();addOperation('Открытие смены','',0,'Смена открыта');persist();renderOperations()};\n  const originalClose=window.closeShift;window.closeShift=function(){originalClose();addOperation('Закрытие смены','',0,'Z-отчёт');persist();renderOperations()};\n  const oldUpdate=window.updateShiftStats;window.updateShiftStats=function(){oldUpdate();renderOperations()};\n  const oldOnLoad=window.onload;window.onload=function(){if(oldOnLoad)oldOnLoad();renderCompositions();renderOperations();searchTickets();if(!state.compositions.length){state.compositions=['Состав №1','Состав №2'];persist();renderCompositions()}};\n  const compCard=document.createElement('div');\n  document.addEventListener('dblclick',function(e){if(e.target&&e.target.id==='compositionSelect')addComposition()});\n})();\n</script>\n<script>\n(function(){\nconst URL='https://ubhfigqpsepnpokrbdyo.supabase.co',KEY='sb_publishable_yN8W8pvQq8hWsYMO8z1Rzw_6zKQ-8D1',TABLE='ticket_shared_state';\nfunction boot(){if(!window.supabase||typeof state==='undefined')return;const c=window.supabase.createClient(URL,KEY,{auth:{persistSession:false}});window.ticketCloudSave=async function(){try{await c.from(TABLE).upsert({id:'main',data:state,updated_at:new Date().toISOString()},{onConflict:'id'})}catch(e){console.error(e)}};c.from(TABLE).select('data').eq('id','main').maybeSingle().then(r=>{if(!r.error&&r.data&&r.data.data&&Object.keys(r.data.data).length){state={...state,...r.data.data};if(Array.isArray(state.tickets))localStorage.setItem('conductor_tickets',JSON.stringify(state.tickets));if(Array.isArray(state.routes))localStorage.setItem('conductor_routes',JSON.stringify(state.routes));if(Array.isArray(state.operations))localStorage.setItem('conductor_operations',JSON.stringify(state.operations));if(typeof renderRoutesTable==='function')renderRoutesTable();if(typeof updateShiftStats==='function')updateShiftStats();if(typeof renderCompositions==='function')renderCompositions();if(typeof renderOperations==='function')renderOperations();if(typeof searchTickets==='function')searchTickets()}})}function load(){if(window.supabase)boot();else{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=boot;document.head.appendChild(s)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();\n})();\n</script>\n'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build full conductor terminal" || exit 0
          git push
