name: Connect shared Supabase state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject shared cloud script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- TICKET_SUPABASE_SHARED -->'
          if marker not in text:
              text = text.replace('</body>', f'    {marker}\n    <script src="./supabase-shared.js"></script>\n</body>')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit injected script
        run: |
          if git diff --quiet; then
            echo "Already connected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect ticket terminal to shared Supabase state"
          git push
